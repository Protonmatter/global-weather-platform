name: scientific-validation

on:
  pull_request:
    paths:
      - 'src/weather_platform/acquisition/noaa/**'
      - 'src/weather_platform/domain/**'
      - 'src/weather_platform/grids/**'
      - 'src/weather_platform/scientific/**'
      - 'src/weather_platform/serving/vector_tiles.py'
      - 'tests/unit/test_probability.py'
      - 'tests/unit/test_verification.py'
      - 'tests/unit/test_grid_assets.py'
      - 'tests/unit/test_gfs_manifest.py'
      - 'tests/unit/test_cycle_lifecycle.py'
      - 'tests/unit/test_coordinates.py'
      - 'tests/unit/test_wind.py'
      - 'tests/unit/test_vector_tiles.py'
      - 'tests/regression/test_weather_adversarial_regressions.py'
      - '.github/workflows/scientific-validation.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scientific-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install with ecCodes
        run: .venv/bin/python -m pip install -e '.[dev,eccodes]'
      - name: Run physical and temporal invariants
        run: |
          mkdir -p artifacts
          .venv/bin/python -m pytest -q --no-cov \
            --junitxml=artifacts/scientific-validation-junit.xml \
            tests/unit/test_probability.py \
            tests/unit/test_verification.py \
            tests/unit/test_grid_assets.py \
            tests/unit/test_gfs_manifest.py \
            tests/unit/test_cycle_lifecycle.py \
            tests/unit/test_coordinates.py \
            tests/unit/test_wind.py \
            tests/unit/test_vector_tiles.py \
            tests/regression/test_weather_adversarial_regressions.py
      - name: Upload scientific evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-validation-${{ github.sha }}
          path: artifacts/scientific-validation-junit.xml
          if-no-files-found: error
          retention-days: 30
