name: schema-contract

on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'src/weather_platform/domain/**'
      - 'deploy/k8s/weather-*.yaml'
      - 'tests/contract/test_weather_schemas.py'
      - 'tests/contract/test_weather_deployment_policy.py'
      - 'scripts/validate_schemas.py'
      - '.github/workflows/schema-contract.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: schema-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install
        run: .venv/bin/python -m pip install -e '.[dev]'
      - name: Validate JSON Schemas
        run: .venv/bin/python scripts/validate_schemas.py
      - name: Run schema and deployment contracts
        run: |
          mkdir -p artifacts
          .venv/bin/python -m pytest -q --no-cov \
            --junitxml=artifacts/schema-contract-junit.xml \
            tests/contract/test_weather_schemas.py \
            tests/contract/test_weather_deployment_policy.py
      - name: Upload schema evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema-contract-${{ github.sha }}
          path: artifacts/schema-contract-junit.xml
          if-no-files-found: error
          retention-days: 14
