name: schema-contract

on:
  workflow_call:
  pull_request:
    paths:
      - 'schemas/**'
      - 'src/weather_platform/domain/**'
      - 'src/scripts/**'
      - 'deploy/k8s/weather-*.yaml'
      - 'requirements/ci.lock'
      - 'tests/unit/test_release_manifest.py'
      - 'tests/contract/test_weather_schemas.py'
      - 'tests/contract/test_weather_deployment_policy.py'
      - 'scripts/validate_schemas.py'
      - '.github/workflows/schema-contract.yml'
permissions:
  contents: read

concurrency:
  group: schema-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install hash-pinned dependencies
        run: |
          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement requirements/ci.lock
          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-build-isolation \
            --no-deps \
            --editable .
      - name: Validate JSON Schemas
        run: .venv/bin/python scripts/validate_schemas.py
      - name: Run schema and deployment contracts
        run: |
          mkdir -p artifacts
          .venv/bin/python -m pytest -q --no-cov \
            --junitxml=artifacts/schema-contract-junit.xml \
            tests/unit/test_release_manifest.py \
            tests/contract/test_weather_schemas.py \
            tests/contract/test_weather_deployment_policy.py
      - name: Upload schema evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema-contract-${{ github.sha }}
          path: artifacts/schema-contract-junit.xml
          if-no-files-found: error
          retention-days: 14
