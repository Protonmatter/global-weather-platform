name: pr-fast

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install hash-pinned dependencies
        run: |
          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement requirements/ci.lock
          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-build-isolation \
            --no-deps \
            --editable .
      - name: Lint
        run: PATH="$PWD/.venv/bin:$PATH" make lint
      - name: Type check
        run: PATH="$PWD/.venv/bin:$PATH" make typecheck
      - name: Test
        run: PATH="$PWD/.venv/bin:$PATH" make test
