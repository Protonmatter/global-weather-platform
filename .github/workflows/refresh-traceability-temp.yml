name: refresh-traceability-temp

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-traceability-temp.yml'

permissions:
  contents: write

concurrency:
  group: refresh-traceability-temp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python -m pip install 'PyYAML>=6.0.2,<7'
      - name: Regenerate traceability
        run: python scripts/generate_traceability.py
      - name: Commit generated artifact
        run: |
          if git diff --quiet -- artifacts/traceability.json; then
            echo 'Traceability artifact already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/traceability.json
          git commit -m 'chore: regenerate traceability artifact'
          git push origin HEAD:${{ github.head_ref }}
