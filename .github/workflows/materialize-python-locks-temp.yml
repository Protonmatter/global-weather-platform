name: materialize-python-locks-temp

on:
  pull_request:
    paths:
      - '.github/workflows/materialize-python-locks-temp.yml'

permissions:
  contents: write

concurrency:
  group: materialize-python-locks-temp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install deterministic compiler
        run: python -m pip install --disable-pip-version-check 'pip==26.1.2' 'pip-tools==7.6.0'
      - name: Generate checked lock files
        run: bash scripts/compile_requirements.sh requirements
      - name: Commit lock files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/production.lock requirements/ci.lock
          if git diff --cached --quiet; then
            echo 'Lock files are already current.'
            exit 0
          fi
          git commit -m 'build: materialize hash-pinned Python locks'
          git push origin HEAD:${{ github.head_ref }}
