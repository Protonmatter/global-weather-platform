# Bootstrap quality gate on an isolated GitHub-hosted Linux runner. Release
# image construction and deep security scans remain on explicitly registered
# internal runners.
name: ci-bootstrap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install (with the ecCodes decode extra)
        run: .venv/bin/python -m pip install -e '.[dev,eccodes]'
      - name: Lint
        run: PATH="$PWD/.venv/bin:$PATH" make lint
      - name: Type check
        run: PATH="$PWD/.venv/bin:$PATH" make typecheck
      - name: Test
        run: PATH="$PWD/.venv/bin:$PATH" make test
      - name: Validate specifications, schemas, and traceability
        run: PATH="$PWD/.venv/bin:$PATH" make validate
