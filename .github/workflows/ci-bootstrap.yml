# Bootstrap quality gate. Runs on ANY Linux self-hosted runner (labels
# self-hosted + linux), using public PyPI, so the moment a runner is registered
# CI executes lint, type check, tests (including the real ecCodes GRIB2 decode
# via the eccodes extra, which bundles its own native library), and spec
# validation. The authoritative gate is pr-fast.yml on internal weather-ci
# runners with the internal package mirror; this bootstrap is superseded once
# those exist. Runner prerequisites: python3.12 and outbound PyPI access.
name: ci-bootstrap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require Python 3.12
        run: |
          command -v python3.12 >/dev/null || { echo "python3.12 is required on the runner" >&2; exit 1; }
          python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Create isolated environment
        run: python3.12 -m venv .venv
      - name: Install (with the ecCodes decode extra)
        run: .venv/bin/python -m pip install -e '.[dev,eccodes]'
      - name: Lint
        run: PATH="$PWD/.venv/bin:$PATH" make lint
      - name: Type check
        run: PATH="$PWD/.venv/bin:$PATH" make typecheck
      - name: Test
        run: PATH="$PWD/.venv/bin:$PATH" make test
      - name: Validate specifications, schemas, and traceability
        run: PATH="$PWD/.venv/bin:$PATH" make validate
