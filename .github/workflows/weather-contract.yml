name: weather-contract

on:
  workflow_call:
  pull_request:
    paths:
      - 'src/weather_platform/acquisition/**'
      - 'src/weather_platform/api/**'
      - 'src/weather_platform/domain/**'
      - 'src/weather_platform/grids/**'
      - 'src/weather_platform/ingestion/eccodes_backend.py'
      - 'src/weather_platform/serving/**'
      - 'src/weather_platform/storage/audit.py'
      - 'src/scripts/**'
      - 'schemas/grids/**'
      - 'schemas/manifests/**'
      - 'deploy/k8s/weather-*.yaml'
      - 'requirements/ci.lock'
      - 'tests/unit/test_audit_domain.py'
      - 'tests/unit/test_source_manifests.py'
      - 'tests/unit/test_grid_assets.py'
      - 'tests/unit/test_grib_index.py'
      - 'tests/unit/test_gfs_manifest.py'
      - 'tests/unit/test_eccodes_backend.py'
      - 'tests/unit/test_cycle_lifecycle.py'
      - 'tests/unit/test_coordinates.py'
      - 'tests/unit/test_wind.py'
      - 'tests/unit/test_vector_tiles.py'
      - 'tests/unit/test_release_manifest.py'
      - 'tests/contract/test_operationalization_routes.py'
      - 'tests/contract/test_request_identity.py'
      - 'tests/contract/test_weather_schemas.py'
      - 'tests/contract/test_weather_deployment_policy.py'
      - 'tests/functional/test_weather_acquisition_cli.py'
      - 'tests/integration/test_weather_vertical_slice.py'
      - 'tests/regression/test_weather_adversarial_regressions.py'
      - '.github/workflows/weather-contract.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: weather-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install hash-pinned dependencies
        run: |
          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement requirements/ci.lock
          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-build-isolation \
            --no-deps \
            --editable .
      - name: Run weather contract tests
        run: |
          mkdir -p artifacts
          .venv/bin/python -m pytest -q --no-cov \
            --junitxml=artifacts/weather-contract-junit.xml \
            tests/unit/test_audit_domain.py \
            tests/unit/test_source_manifests.py \
            tests/unit/test_grid_assets.py \
            tests/unit/test_grib_index.py \
            tests/unit/test_gfs_manifest.py \
            tests/unit/test_eccodes_backend.py \
            tests/unit/test_cycle_lifecycle.py \
            tests/unit/test_coordinates.py \
            tests/unit/test_wind.py \
            tests/unit/test_vector_tiles.py \
            tests/unit/test_release_manifest.py \
            tests/contract/test_operationalization_routes.py \
            tests/contract/test_request_identity.py \
            tests/contract/test_weather_schemas.py \
            tests/contract/test_weather_deployment_policy.py \
            tests/functional/test_weather_acquisition_cli.py \
            tests/integration/test_weather_vertical_slice.py \
            tests/regression/test_weather_adversarial_regressions.py
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weather-contract-${{ github.sha }}
          path: artifacts/weather-contract-junit.xml
          if-no-files-found: error
          retention-days: 14
