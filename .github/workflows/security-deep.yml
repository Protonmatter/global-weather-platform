name: security-deep

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  static-and-policy:
    runs-on: [self-hosted, linux, weather-security]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Execute internal security toolchain
        run: ./scripts/security_scan.sh
