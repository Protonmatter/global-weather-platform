name: spec-validation

on:
  workflow_call:
  pull_request:
    paths:
      - 'specs/**'
      - 'requirements/ci.lock'
      - 'scripts/validate_specs.py'
      - 'scripts/generate_traceability.py'
      - 'artifacts/traceability.json'
      - '.github/workflows/spec-validation.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install reproducible dependencies
        run: |
          .venv/bin/python -m pip install --require-hashes -r requirements/ci.lock
          .venv/bin/python -m pip install --no-build-isolation --no-deps -e .
      - name: Validate specifications and traceability
        run: PATH="$PWD/.venv/bin:$PATH" make validate
