apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: weather-platform-default-deny
  namespace: weather-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: weather-platform-api-ingress
  namespace: weather-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-internal
      ports:
        - protocol: TCP
          port: 8080
