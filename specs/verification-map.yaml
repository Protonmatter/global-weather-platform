# Verification evidence registry.
#
# Every verification identifier referenced by a spec requirement must appear
# here. Entries with status "implemented" must list evidence paths that exist
# in the repository; "planned" entries document verifications that do not
# exist yet. A spec whose front matter declares status "implemented" may only
# reference implemented verifications. scripts/validate_specs.py enforces all
# of this.
