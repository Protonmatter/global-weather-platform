program_increment: PI-001-observation-foundation
objective: Establish authoritative live-data ingestion and a queryable forecast laboratory.
work_items:
  - id: DATA-001
    title: Content-addressed raw object store
    priority: P0
    status: implemented
    requirements: [DATA-RAW-0001]
    acceptance:
      - Original source bytes are immutable and addressable by SHA-256.
      - Canonical records reference the stored source object.
      - Duplicate source records are idempotent.
  - id: DATA-002
    title: WIS2 notification consumer
    priority: P0
    status: implemented
    requirements: [DATA-TIME-0002, DATA-QC-0003]
    acceptance:
      - MQTT notifications are consumed only by the acquisition trust zone.
      - Publication, receipt, and ingestion times remain distinct.
      - Retries do not duplicate canonical observations.
  - id: DATA-003
    title: GRIB2 and BUFR decoder service
    priority: P0
    status: partial
    status_note: Decoder-service framework implemented and tested — pinned definition-table version recorded in provenance, malformed messages rejected safely with evidence retained, decodable-but-suspect messages quarantined, and golden-corpus replay detects semantic drift. The low-level ecCodes GRIB2/BUFR decode is injected and requires the native ecCodes library and definition tables, absent in this environment.
    requirements: [DATA-RAW-0001, DATA-UNIT-0001]
    acceptance:
      - ecCodes table versions are pinned and recorded.
      - Malformed-message corpus is rejected or quarantined safely.
      - Decoder changes replay the golden corpus without unexplained semantic drift.
  - id: DATA-004
    title: Authenticated acquisition transport and upstream integrity verification
    priority: P0
    status: partial
    status_note: Issuer-allowlist, fail-closed, and upstream-checksum verification logic implemented and tested; live MQTT/HTTPS acquisition wiring that supplies the observed chain awaits a deployment target.
    requirements: [DATA-RAW-0001, ARCH-NET-0001]
    acceptance:
      - Acquisition workers verify TLS against a per-source CA allowlist, record the observed issuer chain in provenance, and alert and fail closed on unexpected issuer or chain changes (interception indicators).
      - Upstream-published checksums or signatures are verified before retention; mismatches quarantine the record and alert.
      - Provenance records whether the retained digest was independently confirmed against upstream metadata or is platform-computed only.
      - No acquisition path falls back to unauthenticated or unverified transport.
  - id: MODEL-001
    title: External GFS and GEFS cycle catalog
    priority: P0
    status: implemented
    requirements: [PROG-GOV-0002]
    acceptance:
      - Cycle, lead, grid, variable, level, and source revision are indexed.
      - Missing or partial cycles are explicit.
      - Imported guidance is labeled separately from platform guidance.
  - id: API-001
    title: OGC API EDR position query
    priority: P1
    status: implemented
    requirements: [DATA-GEO-0002]
    acceptance:
      - Position and datetime subset queries pass contract tests.
      - Antimeridian behavior is specified and tested.
      - Responses expose units, provenance, issue time, and valid time.
  - id: SCI-001
    title: Verification dataset ledger
    priority: P0
    status: implemented
    requirements: [VAL-LEAK-0003, VAL-BASE-0001]
    acceptance:
      - Every verification case records availability-at-issue time.
      - Corrected observations are separated from operationally available observations.
      - Baseline forecasts are versioned and reproducible.
  - id: UX-001
    title: Progressive-disclosure forecast shell
    priority: P1
    status: deferred
    status_note: >-
      Deferred by architecture, not effort. The forecast shell belongs in the
      public-distribution/visualization trust zone (SPEC-100), which RFC-0001
      keeps separate from this control plane; its forecast, uncertainty, and
      diagnostic layers presuppose forecast products that do not exist yet; and
      the WCAG 2.2 AA acceptance criterion requires a dedicated frontend stack
      and manual audit. It should be built as a separate visualization service
      once forecast products exist. The governance state it must surface
      (official/imported/platform/experimental via GuidanceOrigin) and staleness
      (cycle completeness) are already modeled and served by MODEL-001.
    requirements: []
    acceptance:
      - Situation, forecast, uncertainty, and diagnostic layers preserve context.
      - Staleness and official-versus-experimental state are visible.
      - Primary workflows meet WCAG 2.2 AA acceptance tests.
